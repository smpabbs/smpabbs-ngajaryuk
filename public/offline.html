<!doctype html>
<html lang="id">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline</title>
    <style>
        /* gaya sederhana mirip Laravel error page */
        html {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
            line-height: 1.5;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f7fafc;
            color: #1a202c;
        }

        .card {
            max-width: 820px;
            width: 100%;
            padding: 36px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 6px 20px rgba(2, 6, 23, 0.06);
            border: 1px solid #e6edf3;
        }

        .code {
            display: inline-block;
            padding: 8px 12px;
            font-weight: 700;
            border-right: 1px solid #e6edf3;
            margin-right: 16px;
            color: #4a5568;
        }

        h1 {
            margin: 0 0 6px;
            font-size: 20px;
            letter-spacing: .06em;
            text-transform: uppercase;
            color: #4a5568;
        }

        p {
            margin: 0;
            color: #718096;
        }

        .desc {
            margin-top: 14px;
            color: #6b7280;
        }

        .small {
            margin-top: 12px;
            font-size: 13px;
            color: #9aa3af;
        }

        @media (max-width:640px) {
            .card {
                padding: 20px
            }

            .code {
                margin-right: 10px
            }
        }
    </style>
</head>

<body>
    <div class="card" role="alert" aria-live="polite">
        <div style="display:flex; align-items:center;">
            <div class="code">—</div>
            <div>
                <h1>Maaf anda offline</h1>
                <div class="desc">Sepertinya kamu sedang tidak terhubung ke internet. Beberapa fitur mungkin tidak
                    tersedia.</div>
                <div class="small">Coba periksa koneksi jaringanmu atau muat ulang saat online.</div>
            </div>
        </div>
    </div>
</body>

</html>
