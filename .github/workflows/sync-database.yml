name: Periodic Database Backup to GitHub

on:
  schedule:
    # Every 6 hours — backup the database
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Manual trigger

jobs:
  backup-db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download database from Vercel
        run: |
          # No direct download, so we just keep the version from the repo.
          # The actual DB sync happens via the app's GitHubDatabaseService.
          echo "Database is stored in this repo. Use the app's 'Sync to GitHub' feature to push latest data."
          echo "This workflow ensures the database.sqlite file is tracked."

      - name: Commit database if changed
        run: |
          git config user.name "smpabbs-bot"
          git config user.email "kurikulumsmpabbs@alabidin.sch.id"
          git add -A
          git diff --staged --quiet || git commit -m "📦 Periodic database backup [skip ci]"
          git push
